appId: com.fawaz.cvfilter
productName: قُمع
directories:
  output: release
  buildResources: build

# Generated by `npm run make-icon`. electron-builder derives .icns and .ico from
# this single 1024px PNG, so there is one source of truth for the mark.
icon: build/icon.png

# Every native dependency here ships prebuilt, ABI-stable N-API binaries
# (better-sqlite3 prebuilds/, onnxruntime-node bin/napi-v6/, sharp @img/*), so
# nothing needs compiling. Leaving the rebuild on makes cross-building for
# Windows fail outright, since node-gyp cannot cross-compile from source.
npmRebuild: false

# Properly ad-hoc signs the macOS bundle; see the script for why this matters
# for anyone who downloads the app rather than building it.
afterPack: scripts/adhoc-sign.cjs

# NOTE: a platform's `files` REPLACES this list rather than merging with it, so
# `mac.files` and `win.files` below each repeat the shared entries. Getting this
# wrong silently ships the whole project directory, including a second copy of
# the 128MB model inside the asar.
#
# onnxruntime-web is 136MB of browser WASM builds that a desktop app never
# touches; inference runs through onnxruntime-node. `sharp` is deliberately NOT
# excluded on any platform: transformers.node.cjs `require`s it at module load,
# so removing it breaks the app even though text pipelines never call into it.
files:
  - out/**
  - package.json
  # Development entry points are built for local verification but are never
  # launched by the installed application.
  - '!out/main/bench.js'
  - '!out/main/eval.js'
  - '!out/main/eval-cross-domain.js'
  - '!out/main/seed.js'
  - '!out/main/smoke.js'
  - '!out/main/chunks/corpus-*.js'
  - '!out/main/chunks/eval-*.js'
  - '!out/main/chunks/smoke-*.js'
  - '!node_modules/onnxruntime-web/**'

# Native modules cannot be dlopen'd from inside an asar archive.
asarUnpack:
  - '**/node_modules/better-sqlite3/**'
  - '**/node_modules/onnxruntime-node/**'
  - '**/node_modules/sharp/**'
  - '**/node_modules/@img/**'

extraResources:
  # Vendored model, so the packaged app is fully offline on every platform.
  - from: resources/models/multilingual-e5-small
    to: models/multilingual-e5-small
    # extraResources copies verbatim, so macOS folder metadata would otherwise
    # be packaged along with the weights.
    filter:
      - '**/*'
      - '!**/.DS_Store'
  # OFL-1.1 requires the licence to travel with the fonts, and the fonts are
  # compiled into the renderer bundle where nothing would otherwise carry it.
  - from: THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md
  - from: LICENSE
    to: LICENSE

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  # Unsigned local build. Without an Apple Developer ID, electron-builder would
  # otherwise fail looking for a certificate. macOS requires a right-click > Open
  # the first time. Set this to your identity if you ever want to distribute.
  identity: null
  # Shared entries repeated: see the note above `files`.
  # Then drop every native binary that is not macOS arm64.
  files:
    - out/**
    - package.json
    - '!out/main/bench.js'
    - '!out/main/eval.js'
    - '!out/main/eval-cross-domain.js'
    - '!out/main/seed.js'
    - '!out/main/smoke.js'
    - '!out/main/chunks/corpus-*.js'
    - '!out/main/chunks/eval-*.js'
    - '!out/main/chunks/smoke-*.js'
    - '!node_modules/onnxruntime-web/**'
    - '!node_modules/onnxruntime-node/bin/napi-v6/linux/**'
    - '!node_modules/onnxruntime-node/bin/napi-v6/win32/**'
    - '!node_modules/onnxruntime-node/bin/napi-v6/darwin/x64/**'
    - '!node_modules/better-sqlite3/prebuilds/!(darwin-arm64.node)'
    - '!node_modules/@img/sharp-win32-*/**'
    - '!node_modules/@img/sharp-linux*/**'
    - '!node_modules/@img/sharp-libvips-linux*/**'

win:
  target:
    - target: nsis
      arch: [x64]
  # Shared entries repeated: see the note above `files`.
  # Then drop every native binary that is not Windows x64.
  files:
    - out/**
    - package.json
    - '!out/main/bench.js'
    - '!out/main/eval.js'
    - '!out/main/eval-cross-domain.js'
    - '!out/main/seed.js'
    - '!out/main/smoke.js'
    - '!out/main/chunks/corpus-*.js'
    - '!out/main/chunks/eval-*.js'
    - '!out/main/chunks/smoke-*.js'
    - '!node_modules/onnxruntime-web/**'
    - '!node_modules/onnxruntime-node/bin/napi-v6/linux/**'
    - '!node_modules/onnxruntime-node/bin/napi-v6/darwin/**'
    - '!node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**'
    - '!node_modules/better-sqlite3/prebuilds/!(win32-x64.node)'
    - '!node_modules/@img/sharp-darwin-*/**'
    - '!node_modules/@img/sharp-libvips-darwin-*/**'
    - '!node_modules/@img/sharp-linux*/**'
    - '!node_modules/@img/sharp-libvips-linux*/**'

nsis:
  # Asks, on uninstall only, whether to remove the resume library from
  # %APPDATA%. Defaults to keeping it; see the script for why.
  include: build/installer.nsh
  # Per-user install, so no UAC admin prompt is needed.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  # Filenames stay ASCII: Arabic in NSIS output paths is a known source of
  # encoding trouble, and a downloaded file should be typeable anywhere.
  artifactName: Qumaa-${version}-Setup-${arch}.exe
  shortcutName: قُمع

dmg:
  artifactName: Qumaa-${version}-${arch}.dmg
